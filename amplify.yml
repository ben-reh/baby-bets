version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - printf "DYNAMODB_REGION=%s\nDYNAMODB_TABLE=%s\nDYNAMODB_ACCESS_KEY_ID=%s\nDYNAMODB_SECRET_ACCESS_KEY=%s\nAPP_URL=%s\n" "${DYNAMODB_REGION}" "${DYNAMODB_TABLE}" "${DYNAMODB_ACCESS_KEY_ID}" "${DYNAMODB_SECRET_ACCESS_KEY}" "${APP_URL}" > .env.production.local
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
